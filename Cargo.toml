[package]
name = "nova-provider-aws"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nova-provider-aws"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic        = "0.12"
prost        = "0.13"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

[build-dependencies]
tonic-build = "0.12"
